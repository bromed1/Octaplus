<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>OCTA+ — новости ММА</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1b1d23;--card:#262932;--c2:#2f333e;--ln:#363a46;--mu:#9aa0ad;--go:#FFC20E;--gold:#F2B01E;--sat:calc(max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));--panel:var(--bg);box-sizing:border-box;padding-top:var(--sat);padding-bottom:var(--sab)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d23}}
:root[data-theme="dark"]{--bg:#1b1d23}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:var(--sat)}
body{margin:0;background:var(--bg);color:#fff;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sat);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
#sp svg *,.ld *{transform-box:fill-box;transform-origin:center}
#sp svg,.ld{overflow:visible}
#sp{position:fixed;inset:0;z-index:100;background:#111;display:grid;place-items:center;transition:opacity .5s;--panel:#111}
#sp.off{opacity:0;pointer-events:none}
.splash{width:min(78vw,380px);height:auto}
.sp{fill:var(--gold);stroke:var(--panel);stroke-width:1.5;opacity:0;animation:fly .8s cubic-bezier(.2,.9,.2,1) calc(.15s + var(--i)*.07s) forwards}
.ic{animation:snap .4s ease-out 1.05s}
.wave{fill:none;stroke:var(--gold);stroke-width:4;opacity:0;animation:wave 1s ease-out 1.1s}
.core{fill:#fff;transform:scale(0);animation:pop .6s cubic-bezier(.2,1.5,.4,1) 1.1s forwards}
.tw{clip-path:inset(0 100% 0 0);animation:wipe .8s cubic-bezier(.65,0,.25,1) 1.5s forwards}
.sweep{fill:var(--gold);opacity:0;animation:sweep .8s cubic-bezier(.65,0,.25,1) 1.5s forwards}
.sprow{opacity:0;animation:rowin .6s ease-out 2.2s forwards}
.lp{fill:var(--gold);stroke:var(--panel);stroke-width:1.5;opacity:.18;animation:chase 1.4s linear infinite;animation-delay:calc(var(--i)*.175s)}
.lcore{fill:#fff;animation:breath 1.4s ease-in-out infinite}
.ld{width:var(--s,72px);height:auto;display:block}
@keyframes fly{from{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6)}to{opacity:1;transform:none}}
@keyframes snap{50%{transform:scale(1.08)}}
@keyframes wave{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
@keyframes pop{to{transform:scale(1)}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes sweep{0%{opacity:1;transform:translateX(0)}92%{opacity:1}100%{opacity:0;transform:translateX(276px)}}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes chase{0%,55%,100%{opacity:.18}6%{opacity:1}30%{opacity:.5}}
@keyframes breath{0%,100%{transform:scale(.86)}50%{transform:scale(1.04)}}
.lw{display:grid;place-items:center;padding:90px 0;--s:76px}
#app{display:flex;min-height:100dvh}
#side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:288px;background:linear-gradient(180deg,#1a1c22,#14161b);border-right:1px solid var(--ln);padding:calc(18px + var(--sat)) 14px 18px;transform:translateX(-100%);transition:transform .25s;overflow:auto;display:flex;flex-direction:column;gap:4px}
#side.on{transform:none}
#sc{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#sc.on{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;color:#fff}

.wm{font-family:"Akira Expanded","Arial Black",sans-serif;font-weight:800;font-size:14px;letter-spacing:.06em;line-height:1;white-space:nowrap}.wm b{color:var(--go);font-weight:inherit}#side .wm{font-size:16px}
.nv{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;color:#c9cdd6;width:100%;text-align:left;font-weight:600;transition:background .15s}
.ni{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c2);color:var(--mu);flex:none;transition:.15s}
.nv:hover{background:rgba(255,255,255,.05)}
.nv.a{background:rgba(255,194,14,.12);color:#fff}.nv.a .ni{background:var(--go);color:#111}
.sub{margin:2px 0 6px 28px;padding-left:12px;border-left:2px solid var(--ln);display:none;flex-direction:column;gap:2px}
.sub .nv{padding:8px 12px;font-size:13px;color:var(--mu)}.sub .nv.a{background:none;color:var(--go)}
.sl{font-size:11px;letter-spacing:.14em;color:#6f7482;font-weight:700;padding:16px 10px 8px}
.sx{flex:1}.fl{color:var(--mu);font-size:12px;padding:12px;border-top:1px solid var(--ln);margin-top:10px}
.wrap>.sh2:first-child{margin-top:4px}
@media (min-width:700px) and (max-width:1023px){.h3>:nth-child(3){display:none}}
#main{flex:1;min-width:0}
.top{position:sticky;top:var(--sat);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;height:58px;padding:0 max(16px,calc((100% - 1148px)/2));border-bottom:1px solid var(--ln)}
.top .sx{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.pill{background:var(--go);color:#111;font-weight:700;border-radius:20px;padding:9px 18px;font-size:13px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.pill.o{background:var(--c2);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 16px}
.sh2{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 14px}.sh2 h2{margin:0;font-size:18px}.lk{color:var(--go);font-weight:600}
.g{display:grid;gap:16px;grid-template-columns:1fr}
.cd{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;cursor:pointer;width:100%;height:100%}
.bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd h3{margin:0;font-size:15px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{color:var(--mu);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:auto}
.tag{color:var(--go);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.th{aspect-ratio:16/9;background:linear-gradient(135deg,hsl(var(--h) 38% 26%),hsl(var(--h) 45% 8%));position:relative;display:grid;place-items:center;overflow:hidden;width:100%;border-radius:0}
.th .lg{position:absolute;width:34%;height:auto;opacity:.13}
.pl{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid #fff;display:grid;place-items:center;position:relative}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);font-size:12px;padding:2px 7px;border-radius:6px}
.lv{position:absolute;left:8px;top:8px;background:#e5383b;font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px;letter-spacing:.06em}
.hero{background:linear-gradient(120deg,#4a3a05,#b98a06 55%,#FFC20E);border-radius:14px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;overflow:hidden;min-height:190px;cursor:pointer}
.hero .tag{color:#fff;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:12px;display:inline-block}
.hero h2{margin:10px 0 8px;font-size:22px;line-height:1.2;max-width:560px}.hero .mt{color:#2b2200;margin:0 0 14px}
.hero .pill{background:#111;color:var(--go)}.hero .lg{width:120px;height:120px;opacity:.3;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.chip{background:var(--card);padding:8px 16px;border-radius:20px;white-space:nowrap;color:var(--mu);font-weight:600}.chip.a{background:var(--go);color:#111}
.seg{display:inline-flex;background:var(--card);border-radius:22px;padding:4px;margin-bottom:16px}
.seg button{padding:8px 20px;border-radius:18px;font-weight:600;color:var(--mu)}.seg .a{background:var(--go);color:#111}
.ev{background:var(--card);border-radius:14px;padding:16px;display:flex;flex-direction:column;height:100%}
.ev .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--mu);font-size:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;padding:18px 0 12px}
.vs b{display:block;font-size:16px}.vs small{color:var(--mu)}.vs i{font-style:normal;color:var(--go);font-weight:900}
.fc{display:none;border-top:1px solid var(--ln);padding-top:8px;margin:4px 0 10px}.open .fc{display:block}
.fc div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:13px}.fc small{color:var(--mu)}
.rw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.mr{display:flex;justify-content:center;margin-top:22px;min-height:44px}
.bn{position:fixed;z-index:25;left:0;right:0;bottom:0;background:#16181d;border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:8px 4px calc(8px + var(--sab))}
.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 10px}.bn .a{color:var(--go)}
#sh{position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#sh.on{display:flex}
#sh .bx{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + var(--sab));max-height:90dvh;overflow:auto}
#sh .bx .th{border-radius:12px;margin:10px 0}#sh .x{float:right}
@media (max-width:520px){.hero .lg{display:none}}
@media (min-width:700px){.g{grid-template-columns:1fr 1fr}.bn{display:none}.wrap{padding-bottom:40px}.hero h2{font-size:28px}.hero .lg{width:150px;height:150px}}
@media (min-width:1024px){#side{position:sticky;transform:none;height:100dvh;flex:none;top:0}#sc{display:none}body.cl #side{display:none}.g{grid-template-columns:repeat(3,1fr)}#sh{align-items:center}#sh .bx{border-radius:20px}}

html,body{overscroll-behavior-y:contain}

.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sub.o{display:flex}.vr{display:flex;align-items:center;gap:4px}.vr .nv{flex:1}.cvb{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--mu);flex:none}.cvb svg{transition:transform .2s}.cvb.o svg{transform:rotate(180deg)}.cvb.o{color:var(--go)}
